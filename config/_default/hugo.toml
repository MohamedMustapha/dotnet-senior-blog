# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://dotnet-senior-blog.pages.dev/"
theme = "congo"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true



[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Road to Senior .NET Developer"
    contentDir = "content/en"
  [languages.fr]
    languageName = "Français"
    weight = 2
    title = "Road to Senior .NET Developer"
    contentDir = "content/fr"
